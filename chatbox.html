<!DOCTYPE html>
<html>
    <head>
        <title>Chat Box</title>
    <style>
    body
        {
        front-family: Arail;
        background:#f4f4f4;
        display:Flex;
        justify-content : center;
        marigen-top:50px;
    };

    .chat contaitner {
        width:350px;
        background:white;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
        overflow:hidden;

    }
    .chat header{
        background: #007bff;
        color: white;
        padding: 15px;
        text-aligen: center;
        font-size: 20px;


    }
    .chat-box{
        height: 300px;
        padding: 10px;
        overflow-y: auto;
        border-button: 1px solid #ccc;

    }
    .message{
        margin: 10px 0;
        padding: 8px 12px;
        border-radius: 8px;
        max-width: 80%;

    }
    .user{
        background: #007bff;
        color: white;
        margin-left: auto;

    }
    .bot{
        background: #e5e5e5;

    }
    .chat-input{
        display: flex;

    }
    .chat-input input{
        flex: 1;
        padding: 10px;
        border: none;
        outline: none;

    }
    .chat-input button{
        padding: 10px 15px;
        border: none;
        background: #007bff;
        color: white;
        cursor: pointer;

    }
    </style>
    </head>

    <body>
        <div Class="chat-container">
            <div class="chat-header">chatbox</div>

            <div Class="chat-box" id="chatBox"></div>

            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="type a message..... ">
                <button onclick="sendmessages()">Send</button>
            </div>
      
        </div>
        <script>
            function sendmessages{
                const input = document.getElementById("messageInput")
                const chatBox = document.getElementById("chatBox")

                if(input.value.trim() === "") return;


                //user message
                const userMsg = document.createElement("div");
                userMsg.className = "message user";
                userMsg.innerText ="input.value";
                chatBox.appendChild("userMsg");
                

                //Bot replay
                const userMsg = document.getElement("div");
                botMsg.className = "message bot";
                botMsg.innerText = "you said" + input.value;

                setTimeout (() => {
                    chatBox.appendChild("botMsg");
                    chatBox.scrollTop = chatBox.scrollHeight;

                } 500);
                input.value = "";
                chatBox.scrollTop = chatBox.scrollHeight;
            }

        </script>
    </body>
</html>
